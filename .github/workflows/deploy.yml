name: Engine CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mvp
          POSTGRES_PASSWORD: FAKE-db-password
          POSTGRES_DB: mvp
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U mvp -d mvp" --health-interval 1s --health-retries 30
    defaults:
      run:
        working-directory: hqg-engine
    env:
      MVP_TEST_DATABASE_URL: postgresql+asyncpg://mvp:FAKE-db-password@127.0.0.1:5432/mvp
    steps:
      - uses: actions/checkout@v4
        with:
          path: hqg-engine
      - uses: actions/checkout@v4
        with:
          repository: Husky-Quantitative-Group/hqg-dashboard
          path: hqg-dashboard
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Run tests
        run: pytest

  deploy:
    name: Deploy Engine Stack
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_SECRET }}" \
            https://platform.uconnquant.com/deploy/hqg-engine \
            || { echo "Deploy trigger failed"; exit 1; }
