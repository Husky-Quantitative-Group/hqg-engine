x-control-environment: &control-environment
  HQG_ACCOUNT_ID: 00000000-0000-4000-8000-000000000001
  HQG_ENGINE_ID: 00000000-0000-4000-8000-000000000002
  DASHBOARD_SYNC_SECRET: local-development-sync-secret
  PROVIDER_WORKER_SECRET: local-development-worker-secret
  DASHBOARD_SYNC_URL: http://mock-dashboard:8011

services:
  db:
    image: postgres:18
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hqg_network

  init-db:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
        http_proxy: ${http_proxy}
        https_proxy: ${https_proxy}
        no_proxy: ${no_proxy}
    container_name: init-db
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: python3 -m src.database
    restart: "no"
    networks:
      - hqg_network

  provider-api:
    build: &engine-build
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
        http_proxy: ${http_proxy}
        https_proxy: ${https_proxy}
        no_proxy: ${no_proxy}
    container_name: provider-api
    depends_on:
      init-db:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      mock-dashboard:
        condition: service_started
    environment:
      <<: *control-environment
      DATABASE_URL: ${DATABASE_URL}
      NO_PROXY: ${NO_PROXY}
      no_proxy: ${no_proxy}
      HTTP_PROXY: ${HTTP_PROXY}
      http_proxy: ${http_proxy}
      HTTPS_PROXY: ${HTTPS_PROXY}
      https_proxy: ${https_proxy}
      PROVIDER: ${PROVIDER}
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      ALPACA_PAPER: ${ALPACA_PAPER:-true}
      ALPACA_DATA_FEED: ${ALPACA_DATA_FEED:-iex}
      IBKR_HOST: ${IBKR_HOST}
      IBKR_PORT: ${IBKR_PORT}
      IBKR_CLIENT_ID: ${IBKR_CLIENT_ID}
    expose:
      - "8000"
    command: python3 -m uvicorn src.provider_instance.server:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - hqg_network
      - control

  dashboard-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
        http_proxy: ${http_proxy}
        https_proxy: ${https_proxy}
        no_proxy: ${no_proxy}
    container_name: dashboard-api
    depends_on:
      init-db:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      provider-api:
        condition: service_healthy
    environment:
      NO_PROXY: ${NO_PROXY}
      no_proxy: ${no_proxy}
      HTTP_PROXY: ${HTTP_PROXY}
      http_proxy: ${http_proxy}
      HTTPS_PROXY: ${HTTPS_PROXY}
      https_proxy: ${https_proxy}
      DATABASE_URL: ${DATABASE_URL}
      PROVIDER_API_URL: http://provider-api:8000
    expose:
      - "8000"
    command: python3 -m uvicorn src.server:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - hqg_network

  snapshot:
    # Uses retired provider read endpoints; retained for separate migration.
    profiles: [legacy-snapshot]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
        http_proxy: ${http_proxy}
        https_proxy: ${https_proxy}
        no_proxy: ${no_proxy}
    container_name: snapshot
    depends_on:
      init-db:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      provider-api:
        condition: service_healthy
    environment:
      NO_PROXY: ${NO_PROXY}
      no_proxy: ${no_proxy}
      DATABASE_URL: ${DATABASE_URL}
      PROVIDER_API_URL: http://provider-api:8000
    volumes:
      - ./src/config:/app/src/config:ro
    command: python3 -m src.snapshot_job
    restart: unless-stopped
    networks:
      - hqg_network

  engine:
    image: hqg-engine-local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
        http_proxy: ${http_proxy}
        https_proxy: ${https_proxy}
        no_proxy: ${no_proxy}
    container_name: engine
    depends_on:
      init-db:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      provider-api:
        condition: service_healthy
    environment:
      <<: *control-environment
      DATABASE_URL: ${DATABASE_URL}
      NO_PROXY: ${NO_PROXY}
      no_proxy: ${no_proxy}
      PROVIDER_API_URL: http://provider-api:8000
      STRATEGY_SANDBOX_IMAGE: hqg-engine-local
    volumes:
      - ./src/config:/app/src/config:ro
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8000"
    command: python3 -m src.main
    restart: unless-stopped
    networks:
      - control

  mock-readiness:
    build: *engine-build
    command: python3 -m uvicorn local.readiness:app --host 0.0.0.0 --port 8014
    restart: unless-stopped
    networks:
      - control

  mock-dashboard:
    build: *engine-build
    volumes:
      - ../hqg-dashboard:/dashboard:ro
      - dashboard_data:/state
    environment:
      <<: *control-environment
      PYTHONPATH: /app:/dashboard/local
      MOCK_DASHBOARD_DB: /state/dashboard.db
      CONTROL_READINESS_URL: http://mock-dashboard:8011/control
      WEBSITE_READINESS_URL: ${LOCAL_WEBSITE_URL:-http://host.docker.internal:5173/}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8011:8011"]
    command: python3 -m uvicorn server:from_environment --factory --host 0.0.0.0 --port 8011
    restart: unless-stopped
    networks:
      - hqg_network
      - control

volumes:
  postgres_data:
  dashboard_data:

networks:
  hqg_network:
    external: true
  control:
    internal: true
