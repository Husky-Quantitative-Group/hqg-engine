version: '3.8'

services:
  db:
    image: postgres:18
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  init-db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: init-db
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: python3 -m src.database
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    depends_on:
      init-db:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
    command: python3 -m uvicorn src.server:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  snapshot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snapshot
    depends_on:
      init-db:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./src/config:/app/src/config:ro
    command: python3 -m src.snapshot_job
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: engine
    depends_on:
      init-db:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./src/config:/app/src/config:ro
    command: python3 -m src.main
    restart: unless-stopped

volumes:
  postgres_data: